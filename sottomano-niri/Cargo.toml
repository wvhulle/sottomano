[package]
name = "sottomano-niri"
edition.workspace = true
version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
sottomano-compositor-model = { path = "../sottomano-compositor-model" }
sottomano-toml-config = { path = "../sottomano-toml-config" }
club-kdl = { version = "0.14.1", features = ["kdl-rs"] }
futures.workspace = true
kdl = { version = "6.7.1", default-features = false, features = ["v1"] }
niri-ipc = { git = "https://github.com/niri-wm/niri", branch = "main" }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "net", "rt"] }
tokio-util = { version = "0.7.20", features = ["codec"] }
tracing.workspace = true

[dev-dependencies]
sottomano-compositor-model = { path = "../sottomano-compositor-model", features = ["test-support"] }
