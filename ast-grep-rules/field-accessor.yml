id: field-accessor
language: rust
severity: error
message: A method that only returns one of its fields is an accessor.
note: Remove the method, give the field the visibility the method had (pub or pub(crate)), and read the field at the call sites. Trait methods are exempt.
rule:
  kind: function_item
  all:
    - has:
        field: parameters
        has:
          kind: self_parameter
        not:
          has:
            kind: parameter
    - has:
        field: body
        any:
          - pattern: "{ self.$FIELD }"
          - pattern: "{ &self.$FIELD }"
          - pattern: "{ self.$FIELD.clone() }"
    - not:
        inside:
          kind: impl_item
          has:
            field: trait
            any:
              - kind: type_identifier
              - kind: scoped_type_identifier
              - kind: generic_type
          stopBy: end
    - not:
        inside:
          kind: mod_item
          has:
            field: name
            pattern: tests
          stopBy: end
