id: sleep-inside-loop
language: rust
severity: error
message: A sleep inside a loop is an ad-hoc retry or poll loop.
note: Reconnects go through protocol_peer_reconnects::subscribed and periodic reads through PeriodicPolling.
ignores:
  - sottomano-desktop-sources/src/system_protocol_clients/protocol_peer_reconnects.rs
rule:
  any:
    - pattern: sleep($$$)
    - pattern: $PATH::sleep($$$)
  inside:
    any:
      - kind: loop_expression
      - kind: for_expression
      - kind: while_expression
    stopBy: end
