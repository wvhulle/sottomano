id: bool-parameter
language: rust
severity: error
message: "Parameter `$NAME: bool` of `$FUNCTION` selects behaviour with a flag that reads as a bare true or false at every call."
note: |
  Split the function in two when callers pass a constant, or take an enum produced where the value originates (rs-enums-over-booleans skill).
  Parameters fixed by a trait implementation, D-Bus proxies and interfaces are exempt.
ignores:
  - "**/*_tests.rs"
labels:
  NAME:
    style: primary
    message: replace with an enum or split the function
  FUNCTION:
    style: secondary
    message: callers pass true or false here
rule:
  kind: parameter
  all:
    - has:
        field: pattern
        pattern: $NAME
    - has:
        field: type
        pattern:
          context: "fn probe(flag: bool) {}"
          selector: primitive_type
    - inside:
        kind: parameters
        inside:
          any:
            - kind: function_item
            - kind: function_signature_item
          has:
            field: name
            pattern: $FUNCTION
  not:
    any:
      - inside:
          matches: rust-test-module
          stopBy: end
      - inside:
          matches: rust-dbus-protocol-mirror
          stopBy: end
      - inside:
          matches: rust-trait-fixed-parameters
