id: nix-module-args
language: nix
severity: error
message: _module.args passes untyped values around the option system.
note: "Declare an option for a value modules share and read it from config; a NixOS test node gets extra module arguments through node.specialArgs."
files:
  - flake.nix
  - flake-modules/**/*.nix
  - vm-tests/**/*.nix
rule:
  any:
    - pattern:
        context: "{ _module.args = $VALUE; }"
        selector: binding
    - pattern:
        context: "{ $PREFIX._module.args.$NAME = $VALUE; }"
        selector: binding
