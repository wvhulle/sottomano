id: debug-format-key
language: rust
severity: error
message: "`$METHOD` keyed on `format!` output depends on how Debug happens to print."
labels:
  METHOD:
    style: primary
    message: sorted or deduplicated by formatted text
  FORMATTED:
    style: secondary
    message: key built from formatted text
note: Collect into a HashSet or BTreeSet, or derive Ord on the key type and sort by it.
rule:
  kind: call_expression
  all:
    - has:
        field: function
        kind: field_expression
        has:
          field: field
          pattern: $METHOD
          any:
            - pattern: { context: "values.sort_by_key", selector: field_identifier }
            - pattern: { context: "values.sort_unstable_by_key", selector: field_identifier }
            - pattern: { context: "values.sort_by_cached_key", selector: field_identifier }
            - pattern: { context: "values.dedup_by_key", selector: field_identifier }
            - pattern: { context: "values.max_by_key", selector: field_identifier }
            - pattern: { context: "values.min_by_key", selector: field_identifier }
    - has:
        field: arguments
        has:
          kind: closure_expression
          has:
            kind: macro_invocation
            pattern: $FORMATTED
            has:
              field: macro
              pattern: format
            stopBy: end
