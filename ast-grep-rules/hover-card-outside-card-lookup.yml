id: hover-card-outside-card-lookup
language: rust
severity: error
message: A hover card built outside the card lookup bypasses the one path from a hovered target to its card.
note: Give the row its card with with_hover_card or its ReadingRow card; the shell and the showcase turn the hovered target into a HoverCard in their card lookup.
files:
  - sottomano-widgets/src/**/*.rs
  - sottomano-shell/src/**/*.rs
  - sottomano-widget-showcase/src/**/*.rs
ignores:
  - sottomano-widgets/src/hover_cards/hover_card_body/hover_card_source_delivery.rs
  - sottomano-widgets/src/group_menus/group_menu_view.rs
  - sottomano-shell/src/widget_groups/group_hover_cards.rs
  - sottomano-widget-showcase/src/showcased_group.rs
rule:
  kind: call_expression
  has:
    field: function
    regex: '(^|::)HoverCard::new$'
