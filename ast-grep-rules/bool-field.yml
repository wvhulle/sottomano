id: bool-field
language: rust
severity: error
message: "`$OWNER::$NAME` is a bool: it names one state and leaves the other unnamed at every use."
note: |
  Model the states as an enum at their source; correlated bools on one type become one enum (rs-enums-over-booleans skill).
  Types that mirror an external format through a serde, clap, zvariant or KDL derive are exempt; convert them right after reading.
ignores:
  - "**/*_tests.rs"
labels:
  NAME:
    style: primary
    message: replace with an enum naming both states
  OWNER:
    style: secondary
    message: check this type for other bools describing the same thing
rule:
  kind: field_declaration
  all:
    - has:
        field: name
        pattern: $NAME
    - has:
        field: type
        pattern:
          context: "struct Probe { field: bool }"
          selector: primitive_type
    - inside:
        any:
          - kind: struct_item
          - kind: enum_variant
        has:
          field: name
          pattern: $OWNER
        stopBy: end
  not:
    matches: rust-exempt-from-state-rules
