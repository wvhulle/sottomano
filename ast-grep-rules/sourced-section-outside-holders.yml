id: sourced-section-outside-holders
language: rust
severity: error
message: "`$CONSTRUCTION` decides which source a section came from outside the snapshot holders."
note: Build sections with Section::new and let SubscribedSnapshot or HoverFetchedSnapshot stamp them with hover_card_with or sections_described_by. Only the stamping methods sections_described_by, Section::stamped_by and AbsenceCause::source_state construct a source.
ignores:
  - "**/*_tests.rs"
files:
  - sottomano-widgets/src/**/*.rs
  - sottomano-shell/src/**/*.rs
  - sottomano-widget-showcase/src/**/*.rs
rule:
  pattern: $CONSTRUCTION
  any:
    - kind: struct_expression
      has:
        field: name
        any:
          - pattern: { context: "SectionSource::Snapshot {}", selector: scoped_type_identifier }
          - pattern: { context: "DeliveryStamp {}", selector: type_identifier }
    - kind: scoped_identifier
      any:
        - pattern: SourceDelivery::Delivered
        - pattern: SourceDelivery::Loading
        - pattern: SourceDelivery::Failed
      not:
        inside:
          any:
            - kind: match_pattern
            - kind: tuple_struct_pattern
            - kind: let_condition
            - kind: or_pattern
          stopBy: end
  not:
    any:
      - inside:
          matches: rust-test-module
          stopBy: end
      - inside:
          kind: function_item
          stopBy: end
          has:
            field: name
            any:
            - pattern: sections_described_by
            - pattern: stamped_by
            - pattern: source_state
