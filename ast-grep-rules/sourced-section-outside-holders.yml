id: sourced-section-outside-holders
language: rust
severity: error
message: "`$CONSTRUCTION` decides which source a section came from outside the snapshot holders."
note: Build sections with Section::new and let SubscribedSnapshot or HoverFetchedSnapshot stamp them with hover_card_with or sections_described_by.
files:
  - sottomano-widgets/src/**/*.rs
  - sottomano-shell/src/**/*.rs
  - sottomano-widget-showcase/src/**/*.rs
ignores:
  - sottomano-widgets/src/hover_cards/hover_card_body.rs
  - sottomano-widgets/src/hover_cards/hover_card_body/hover_card_source_delivery.rs
  - sottomano-widgets/src/hover_cards/hover_card_content.rs
  - sottomano-widgets/src/widgets/subscribed_snapshot.rs
  - sottomano-widgets/src/widgets/hover_fetched_snapshot.rs
  - sottomano-widgets/src/group_indicators/snapshot_absence.rs
rule:
  pattern: $CONSTRUCTION
  any:
    - kind: struct_expression
      has:
        field: name
        any:
          - pattern: { context: "SectionSource::Snapshot {}", selector: scoped_type_identifier }
          - pattern: { context: "DeliveryStamp {}", selector: type_identifier }
    - kind: scoped_identifier
      any:
        - pattern: SourceDelivery::Delivered
        - pattern: SourceDelivery::Loading
        - pattern: SourceDelivery::Failed
      not:
        inside:
          any:
            - kind: match_pattern
            - kind: tuple_struct_pattern
            - kind: let_condition
            - kind: or_pattern
          stopBy: end
  not:
    inside:
      matches: rust-test-module
      stopBy: end
