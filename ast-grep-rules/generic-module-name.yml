id: generic-module-name
language: rust
severity: error
message: A module named after a language concept or a catch-all says nothing about the domain it holds.
note: Name the module after the domain it models, as in theme_icons or cascading_menus, and split it if no single domain name fits.
files:
  - sottomano-*/src/**/*.rs
  - corredo/src/**/*.rs
  - iced_controller_diagram/src/**/*.rs
  - xtask/src/**/*.rs
rule:
  kind: mod_item
  has:
    field: name
    regex: ^(utils?|helpers?|common|misc|types|traits|models|.*_operators|.*_utils|.*_helpers)$
