id: option-field
language: rust
severity: error
message: "`$OWNER::$NAME` is an `Option<$INNER>`: one field holds two kinds of value, and every reader re-checks for None."
note: |
  Use an enum variant per state, a separate constructor, or compute the value before constructing (rs-no-option-fields skill).
  When the outside world may not report the value, produce an enum whose absent variant names what absence means (Untitled, NotReported, Unlimited) where it is read.
  Types that mirror an external format through a serde, clap, zvariant or KDL derive are exempt; convert them into internal types right after reading.
ignores:
  - "**/*_tests.rs"
labels:
  NAME:
    style: primary
    message: present in some states only
  OWNER:
    style: secondary
    message: model the states of this type as enum variants
rule:
  kind: field_declaration
  all:
    - has:
        field: name
        pattern: $NAME
    - has:
        field: type
        pattern:
          context: "struct Probe { field: Option<$INNER> }"
          selector: generic_type
    - inside:
        any:
          - kind: struct_item
          - kind: enum_variant
        has:
          field: name
          pattern: $OWNER
        stopBy: end
  not:
    matches: rust-exempt-from-state-rules
