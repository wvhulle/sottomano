id: option-field
language: rust
severity: error
message: An Option field squeezes two kinds of value into one type.
note: Use an enum variant per state, a separate constructor, or compute the value before constructing (rs-no-option-fields skill). The files list is a ratchet; widen it as modules are cleaned.
files:
  - sottomano-widgets/src/group_indicators/**/*.rs
  - sottomano-widgets/src/hover_cards/**/*.rs
  - sottomano-desktop-sources/src/theme_icons/**/*.rs
  - sottomano-widgets/src/icon_catalog/**/*.rs
  - sottomano-widgets/src/glyph_icons/**/*.rs
  - sottomano-widgets/src/cascading_menus/**/*.rs
rule:
  any:
    - kind: field_declaration
      has:
        field: type
        kind: generic_type
        regex: '^Option<'
    - kind: ordered_field_declaration_list
      has:
        kind: generic_type
        regex: '^Option<'
  not:
    inside:
      kind: mod_item
      has:
        field: name
        regex: ^tests$
      stopBy: end
