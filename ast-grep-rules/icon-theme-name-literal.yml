id: icon-theme-name-literal
language: rust
severity: error
message: "Naming the icon theme `$THEME` assumes a theme the user may not have installed."
labels:
  THEME:
    style: primary
    message: follow the settings portal instead
note: Follow the icon theme from the settings portal (theme_icons/icon_theme_setting.rs); the only theme the code may name is FALLBACK_THEME_NAME, the freedesktop-mandated hicolor.
ignores:
  - "**/*_tests.rs"
rule:
  kind: string_content
  pattern: $THEME
  regex: '^(?i)(colloid|breeze|papirus|adwaita|yaru|numix|tela|kora|candy-icons|oxygen)([-_ ].*)?$'
  not:
    inside:
      matches: rust-test-module
      stopBy: end
