id: icon-theme-name-literal
language: rust
severity: error
message: Naming an icon theme in code assumes a theme the user may not have installed.
note: Follow the icon theme from the settings portal (theme_icons/icon_theme_setting.rs); the only theme the code may name is FALLBACK_THEME_NAME, the freedesktop-mandated hicolor.
files:
  - sottomano-desktop-sources/src/**/*.rs
  - sottomano-desktop-sinks/src/**/*.rs
  - sottomano-widgets/src/**/*.rs
  - sottomano-shell/src/**/*.rs
  - sottomano-widget-showcase/src/**/*.rs
  - sottomano-toml-config/src/**/*.rs
  - corredo/src/**/*.rs
  - xtask/src/**/*.rs
rule:
  kind: string_content
  regex: '^(?i)(colloid|breeze|papirus|adwaita|yaru|numix|tela|kora|candy-icons|oxygen)([-_ ].*)?$'
  not:
    inside:
      kind: mod_item
      has:
        field: name
        regex: ^tests$
      stopBy: end
