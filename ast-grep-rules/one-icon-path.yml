id: one-icon-path
language: rust
severity: error
message: Resolving theme icons outside the icon catalog splits icon loading, caching and theme switching across several paths.
note: Request icons from IconCatalog with the *_icon_request constructors in theme_icons/icon_requests.rs, and draw the DrawableIcon it returns.
ignores:
  - sottomano-desktop-sources/src/theme_icons/**/*.rs
  - sottomano-widgets/src/icon_catalog/**/*.rs
rule:
  any:
    - kind: identifier
      regex: '^(loaded_icon_file|matching_icon_file|indexed_icon_theme|resolved_icons|freedesktop_icons)$'
