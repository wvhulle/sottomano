id: instant-subtraction
language: rust
severity: error
message: Subtracting instants yields zero silently when the earlier instant is later.
note: Use later.checked_duration_since(earlier) and expect the order when both come from the same clock, or handle None.
rule:
  kind: binary_expression
  all:
    - has:
        field: operator
        regex: ^-$
    - any:
        - has:
            field: left
            any:
              - pattern: $CLOCK.instant
              - pattern: Instant::now()
        - has:
            field: right
            any:
              - pattern: $CLOCK.instant
              - pattern: Instant::now()
