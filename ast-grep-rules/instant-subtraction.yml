id: instant-subtraction
language: rust
severity: error
message: "`$LATER - $EARLIER` yields zero silently when `$EARLIER` is actually later."
note: Use later.checked_duration_since(earlier) and expect the order when both come from the same clock, or handle None.
labels:
  LATER:
    style: secondary
    message: assumed later
  EARLIER:
    style: secondary
    message: assumed earlier
rule:
  pattern: $LATER - $EARLIER
  any:
    - has:
        field: left
        any:
          - pattern: $CLOCK.instant
          - pattern: Instant::now()
    - has:
        field: right
        any:
          - pattern: $CLOCK.instant
          - pattern: Instant::now()
