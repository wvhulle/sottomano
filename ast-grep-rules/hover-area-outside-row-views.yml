id: hover-area-outside-row-views
language: rust
severity: error
message: "`$CALL` creates a hover area outside the row, group face and standalone views, giving one row several cards or targets."
note: A row has exactly one hover area, made by its row view from its IndicatorKey; declare a button's actions on the row with with_button_actions instead of wrapping the button in its own hover area. A group face or standalone view wraps itself in a hover area only in its method named hovered.
rule:
  kind: call_expression
  pattern: $CALL
  has:
    field: function
    any:
      - kind: identifier
        pattern: hoverable
      - kind: scoped_identifier
        has:
          field: name
          pattern: hoverable
  not:
    any:
      - inside:
          matches: rust-test-module
          stopBy: end
      - inside:
          kind: function_item
          stopBy: end
          has:
            field: name
            any:
            - pattern: hovered
