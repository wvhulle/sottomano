id: blocking-io-in-async
language: rust
severity: error
message: A blocking filesystem call inside async code stalls the executor thread every other task shares.
note: Use tokio::fs (tokio::fs::metadata, read, read_dir, try_exists), or move the work into blocking(...) from blocking_background_work.
constraints:
  PATH:
    not:
      regex: '(?i)(metadata|file_type)$'
rule:
  any:
    - pattern: std::fs::$OPERATION($$$)
    - pattern: $PATH.exists()
    - pattern: $PATH.is_file()
    - pattern: $PATH.is_dir()
    - pattern: $PATH.read_dir()
    - pattern: $PATH.canonicalize()
  inside:
    any:
      - kind: async_block
      - kind: function_item
        has:
          kind: function_modifiers
          regex: async
    stopBy:
      any:
        - kind: closure_expression
        - kind: async_block
        - kind: function_item
  not:
    inside:
      kind: mod_item
      has:
        field: name
        regex: ^tests$
      stopBy: end
