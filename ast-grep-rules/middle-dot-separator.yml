id: middle-dot-separator
language: rust
severity: error
message: A middle dot glues separate facts into one label.
note: Give each fact its own indicator, row, table value or text run instead of joining them with '·'.
ignores:
  - sottomano-desktop-sources/src/desktop_windows_apps/window_title_labels/split_app_title.rs
rule:
  any:
    - kind: string_content
    - kind: char_literal
  regex: '·'
  not:
    inside:
      kind: mod_item
      has:
        field: name
        regex: ^tests$
      stopBy: end
