on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  vm-tests:
    runs-on: nix
    env:
      NIX_CONFIG: |
        experimental-features = nix-command flakes
        extra-system-features = kvm nixos-test
        max-jobs = 1
        accept-flake-config = true
    steps:
      - name: Clone the commit
        run: |
          git init --quiet
          git remote add origin "${{ github.server_url }}/${{ github.repository }}.git"
          git fetch --quiet --depth 1 origin "${{ github.sha }}"
          git checkout --quiet FETCH_HEAD

      - name: Require KVM
        run: test -r /dev/kvm -a -w /dev/kvm

      - name: niri session
        run: nix build --quiet --no-link --print-build-logs .#checks.x86_64-linux.vm-niri

      - name: sway session
        run: nix build --quiet --no-link --print-build-logs .#checks.x86_64-linux.vm-sway

      - name: Hyprland session
        run: nix build --quiet --no-link --print-build-logs .#checks.x86_64-linux.vm-hyprland
