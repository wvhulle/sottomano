[package]
name = "sottomano-shell"
edition.workspace = true
version.workspace = true
license.workspace = true
default-run = "sottomano"

[[bin]]
name = "sottomano"
path = "src/main.rs"

[[bin]]
name = "sottomano-secret-memory-holders"
path = "src/secret_memory_holders_main.rs"

[lints]
workspace = true

[dependencies]
sottomano-toml-config = { path = "../sottomano-toml-config" }
sottomano-desktop-sources = { path = "../sottomano-desktop-sources" }
sottomano-desktop-sinks = { path = "../sottomano-desktop-sinks" }
sottomano-widgets = { path = "../sottomano-widgets" }
chrono.workspace = true
clap.workspace = true
iced.workspace = true
iced_controller_diagram.workspace = true
iced_exwlshell.workspace = true
iced_wayland_subscriber = { git = "https://github.com/wvhulle/exwlshelleventloop.git", branch = "master" }
wayland-client = "0.31.15"
tracing.workspace = true
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
reqwest.workspace = true
tokio.workspace = true
turso.workspace = true
zbus.workspace = true
uom.workspace = true

[dev-dependencies]
sottomano-desktop-sources = { path = "../sottomano-desktop-sources", features = ["test-support"] }

[features]
default = ["hyprland", "libvirt-domains", "niri", "sway"]
devtools = ["iced_exwlshell/debug"]
hyprland = ["sottomano-desktop-sinks/hyprland"]
libvirt-domains = ["sottomano-desktop-sinks/libvirt-domains"]
niri = ["sottomano-desktop-sinks/niri"]
sway = ["sottomano-desktop-sinks/sway"]
time-travel = ["iced_exwlshell/time-travel"]
