[package]
name = "sottomano-shell"
edition.workspace = true
version.workspace = true
license.workspace = true
default-run = "sottomano"

[[bin]]
name = "sottomano"
path = "src/main.rs"

[[bin]]
name = "sottomano-secret-memory-holders"
path = "src/secret_memory_holders_main.rs"

[lints]
workspace = true

[dependencies]
sottomano-toml-config = { path = "../sottomano-toml-config" }
sottomano-compositor-model = { path = "../sottomano-compositor-model" }
sottomano-compositors = { path = "../sottomano-compositors" }
sottomano-desktop-sources = { path = "../sottomano-desktop-sources" }
sottomano-desktop-sinks = { path = "../sottomano-desktop-sinks" }
corredo = { path = "../corredo" }
sottomano-widgets = { path = "../sottomano-widgets" }
chrono.workspace = true
clap.workspace = true
iced.workspace = true
iced_controller_diagram.workspace = true
iced_exwlshell.workspace = true
iced_wayland_subscriber = { git = "https://github.com/wvhulle/exwlshelleventloop.git", branch = "master" }
wayland-client.workspace = true
tracing.workspace = true
strum.workspace = true
rustix = { workspace = true, features = ["param"] }
signal-hook = "0.3.18"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-chrome = "0.7.2"
tokio.workspace = true
turso.workspace = true
zbus.workspace = true
libm = "0.2.16"

[dev-dependencies]
sottomano-desktop-sources = { path = "../sottomano-desktop-sources", features = ["test-support"] }

[features]
default = ["hyprland", "libvirt-domains", "niri", "sway"]
devtools = ["iced_exwlshell/debug"]
allocation-tally = []
hyprland = ["sottomano-compositors/hyprland"]
libvirt-domains = ["sottomano-desktop-sinks/libvirt-domains"]
niri = ["sottomano-compositors/niri"]
sway = ["sottomano-compositors/sway"]
time-travel = ["iced_exwlshell/time-travel"]
