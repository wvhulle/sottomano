id: rust-dbus-protocol-mirror
language: rust
rule:
  any:
    - kind: trait_item
    - kind: impl_item
  follows:
    kind: attribute_item
    has:
      kind: attribute
      has:
        any:
          - pattern: proxy
          - pattern: interface
          - pattern: zbus::proxy
          - pattern: zbus::interface
    stopBy:
      not:
        kind: attribute_item
