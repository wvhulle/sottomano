[package]
edition = "2024"
name = "odin-rs"
version = "0.1.0"

[lints.clippy]
absolute_paths = "warn"
pedantic = { priority = -1, level = "warn" }

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
color = { version = "0.3.3", features = ["serde"] }
freedesktop-desktop-entry = "0.8.1"
freedesktop-icons = "0.4.0"
iced = { version = "0.14.0", features = ["tokio", "image"] }
iced_font_awesome = "0.4.2"
# Local fork of wvhulle/exwlshelleventloop with the multi-surface present-error
# fix (Outdated/Lost → reconfigure/recreate). Track master; force-push to update.
# https (not ssh) so both local cargo and the Nix build sandbox can fetch without
# an ssh-agent.
iced_layershell = { git = "https://github.com/wvhulle/exwlshelleventloop.git", branch = "master" }
libc = "0.2.176"
niri-ipc = "26.4.0"
rust-fontconfig = "4.4.6"
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.53.0", features = [
  "rt-multi-thread",
  "macros",
  "time",
  "sync",
] }
toml = "0.8.23"

# Develop against the local checkout of the fork so output-event changes in
# layershellev/iced_layershell are picked up without a push. Drop this once the
# fork's master has them and bump the git dep above.
[patch."https://github.com/wvhulle/exwlshelleventloop.git"]
iced_layershell = { path = "/home/wvhulle/Code/exwlshelleventloop/iced_layershell" }
