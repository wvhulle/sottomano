[workspace]
default-members = ["sottomano-shell"]
members = [
  "corredo",
  "db-migrations",
  "iced_controller_diagram",
  "sottomano-toml-config",
  "sottomano-phosphor-icons",
  "sottomano-simple-icons",
  "sottomano-weather-icons",
  "sottomano-compositor-model",
  "sottomano-niri",
  "sottomano-hyprland",
  "sottomano-sway",
  "sottomano-compositors",
  "sottomano-desktop-sources",
  "sottomano-desktop-sinks",
  "sottomano-widgets",
  "sottomano-shell",
  "sottomano-widget-scenes",
  "sottomano-tour-recordings",
  "xtask",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"
version = "0.1.0"

[workspace.lints.clippy]
absolute_paths = "warn"
disallowed_methods = "deny"
disallowed_types = "deny"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
implicit_hasher = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
needless_for_each = "allow"
pedantic = { priority = -1, level = "warn" }

[workspace.dependencies]
bytesize = "2.7.0"
chrono = { version = "0.4.45", default-features = false, features = [
  "clock",
  "serde",
  "std",
  "unstable-locales",
] }
chrono-tz = { version = "0.10.4", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
color = "0.3.3"
futures = "0.3.34"
futures-rx = "=0.4.0"
jiff = { version = "0.2.38", default-features = false, features = [
  "serde",
  "std",
  "tz-system",
  "tzdb-zoneinfo",
] }
icu_locale_core = "2.3.0"
iced = { version = "0.14.0", default-features = false, features = [
  "wgpu",
  "tiny-skia",
  "crisp",
  "web-colors",
  "thread-pool",
  "linux-theme-detection",
  "x11",
  "wayland",
  "advanced",
  "tokio",
  "image-without-codecs",
  "svg",
  "canvas",
] }
iced_test = "0.14.0"
iced_controller_diagram = { path = "iced_controller_diagram", version = "0.1.0" }
iced_exwlshell = { git = "https://github.com/wvhulle/exwlshelleventloop.git", branch = "master" }
image = { version = "0.25.10", default-features = false, features = [
  "png",
  "jpeg",
  "webp",
  "ico",
  "gif",
] }
notulist-client = { git = "https://codeberg.org/wvhulle/notulist", branch = "main" }
reqwest = { version = "0.13.5", default-features = false, features = [
  "native-tls",
] }
rustix = "1.1.5"
rust_decimal = { version = "1.43.0", features = ["serde-float"] }
rusty-money = "0.5.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
strum = { version = "0.26", features = ["derive"] }
situo-client = { git = "https://codeberg.org/wvhulle/situo", branch = "main" }
system-tray = "0.8.9"
thiserror = "2.0.17"
tokio = { version = "1.53.3", features = [
  "fs",
  "io-util",
  "process",
  "rt-multi-thread",
  "macros",
  "time",
  "sync",
] }
toml = "1.1.8"
tracing = "0.1.44"
turso = { version = "0.8.3", default-features = false }
uom = { version = "0.38.0", default-features = false, features = [
  "autoconvert",
  "f64",
  "si",
  "std",
] }
virt = "0.4.3"
usvg = "0.48.1"
zbus = { version = "5.19.0", default-features = false, features = [
  "tokio",
  "blocking-api",
] }

[patch.crates-io]
iced = { git = "https://github.com/wvhulle/iced.git", branch = "master" }
iced_core = { git = "https://github.com/wvhulle/iced.git", branch = "master" }
iced_debug = { git = "https://github.com/wvhulle/iced.git", branch = "master" }
iced_devtools = { git = "https://github.com/wvhulle/iced.git", branch = "master" }
iced_futures = { git = "https://github.com/wvhulle/iced.git", branch = "master" }
iced_graphics = { git = "https://github.com/wvhulle/iced.git", branch = "master" }
iced_program = { git = "https://github.com/wvhulle/iced.git", branch = "master" }
iced_renderer = { git = "https://github.com/wvhulle/iced.git", branch = "master" }
iced_runtime = { git = "https://github.com/wvhulle/iced.git", branch = "master" }
iced_selector = { git = "https://github.com/wvhulle/iced.git", branch = "master" }
iced_test = { git = "https://github.com/wvhulle/iced.git", branch = "master" }
iced_tester = { git = "https://github.com/wvhulle/iced.git", branch = "master" }
iced_tiny_skia = { git = "https://github.com/wvhulle/iced.git", branch = "master" }
iced_wgpu = { git = "https://github.com/wvhulle/iced.git", branch = "master" }
iced_widget = { git = "https://github.com/wvhulle/iced.git", branch = "master" }
iced_winit = { git = "https://github.com/wvhulle/iced.git", branch = "master" }
system-tray = { git = "https://github.com/wvhulle/system-tray.git", branch = "master" }

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.debugging]
inherits = "dev"
debug = 2
