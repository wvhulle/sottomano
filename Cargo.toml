[package]
edition = "2024"
name = "vetrata"
version = "0.1.0"

[workspace]
members = ["crates/phosphor-icons"]

[lints.clippy]
absolute_paths = "warn"
pedantic = { priority = -1, level = "warn" }
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
needless_for_each = "allow"

[dependencies]
chrono = { version = "0.4", default-features = false, features = [
  "clock",
  "serde",
  "std",
  "unstable-locales",
] }
form_urlencoded = "1.2"
color = { version = "0.3.3", features = ["serde"] }
freedesktop-desktop-entry = "0.8.1"
freedesktop-icons = "0.4.0"
freedesktop-sound = "0.1"
phosphor-icons = { path = "crates/phosphor-icons" }
humantime = "2.3"
iced = { version = "0.14.0", features = [
  "advanced",
  "tokio",
  "image-without-codecs",
  "svg",
  "canvas",
] }
icu_locale_core = "2.2"
sys-locale = "0.3"
iced_exwlshell = { git = "https://github.com/wvhulle/exwlshelleventloop.git", branch = "master" }
iced_wayland_subscriber = { git = "https://github.com/wvhulle/exwlshelleventloop.git", branch = "master" }
wayland-client = "0.31"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
image = { version = "0.25", default-features = false, features = [
  "png",
  "jpeg",
  "webp",
  "ico",
  "gif",
] }
libc = "0.2.176"
niri-ipc = "26.4.0"
procfs = { version = "0.18", default-features = false }
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls-native-roots",
] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
simpleicons-rs = "16.27"
situo-client = { git = "https://codeberg.org/wvhulle/situo", branch = "main" }
sunrise = "3"
systemd = "0.10"
system-tray = "0.8"
ttf-parser = "0.25"
tokio = { version = "1.53.0", features = [
  "process",
  "rt-multi-thread",
  "macros",
  "time",
  "sync",
] }
tokio-stream = { version = "0.1", default-features = false, features = [
  "sync",
  "time",
] }
toml = "0.8.23"
turso = "0.8.0-pre.1"
usvg = "0.45"
wayrs-client = { version = "1", features = ["tokio"] }
wayrs-protocols = { version = "0.14", features = ["ext-idle-notify-v1"] }
zbus = { version = "5.18", default-features = false, features = [
  "tokio",
  "blocking-api",
] }
adskalman = "0.17.0"
nalgebra = "0.34"
pipewire = "0.8"
bytesize = "2.7.0"
inotify = "0.11.5"
uom = { version = "0.38.0", default-features = false, features = [
  "autoconvert",
  "f64",
  "si",
  "std",
] }
