[package]
edition = "2024"
name = "vetrata"
version = "0.1.0"

[lints.clippy]
absolute_paths = "warn"
pedantic = { priority = -1, level = "warn" }

[dependencies]
chrono = { version = "0.4", default-features = false, features = [
  "clock",
  "std",
] }
color = { version = "0.3.3", features = ["serde"] }
freedesktop-desktop-entry = "0.8.1"
freedesktop-icons = "0.4.0"
humantime = "2.3"
iced = { version = "0.14.0", features = ["tokio", "image", "svg"] }
iced_font_awesome = "0.4.2"
# Local fork of wvhulle/exwlshelleventloop with the multi-surface present-error
# fix (Outdated/Lost → reconfigure/recreate). Track master; force-push to update.
# https (not ssh) so both local cargo and the Nix build sandbox can fetch without
# an ssh-agent.
iced_layershell = { git = "https://github.com/wvhulle/exwlshelleventloop.git", branch = "master" }
libc = "0.2.176"
niri-ipc = "26.4.0"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ttf-parser = "0.25"
tokio = { version = "1.53.0", features = [
  "rt-multi-thread",
  "macros",
  "time",
  "sync",
] }
tokio-stream = { version = "0.1", default-features = false, features = [
  "time",
] }
toml = "0.8.23"
# Pure-Rust SQLite (the Turso/Limbo rewrite) for vetrata's own persistent state,
# e.g. the quick-launch frequency store. Async; runs on the iced/tokio runtime.
turso = "0.8.0-pre.1"
# Trim the transparent margin themed icon SVGs ship with (see data_sources::icon_trim).
# Pinned to the version iced_tiny_skia already resolves, so no second usvg copy.
usvg = "0.45"
# Wayland client for the in-process idle-timeout daemon (absorbed from
# wvhulle/idle-manager): arms one ext-idle-notify-v1 notification per enabled
# subsystem and spawns its bound command when the compositor reports idle.
wayrs-client = { version = "1", features = ["tokio"] }
wayrs-protocols = { version = "0.14", features = ["ext-idle-notify-v1"] }
# Pure-Rust D-Bus (no libdbus). Two uses: the async notification server
# (org.freedesktop.Notifications) on iced's tokio runtime, and the blocking API
# from sync source polls (systemd's Manager for failed units) — hence both the
# `tokio` and `blocking-api` features.
zbus = { version = "5.18", default-features = false, features = [
  "tokio",
  "blocking-api",
] }

[build-dependencies]
serde_json = "1"
