[package]
edition = "2024"
name = "odin-rs"
version = "0.1.0"

[lints.clippy]
absolute_paths = "warn"
pedantic = { priority = -1, level = "warn" }

[dependencies]
freedesktop-desktop-entry = "0.8.1"
freedesktop-icons = "0.4.0"
iced = { version = "0.14.0", features = ["tokio", "image"] }
iced_font_awesome = "0.4.2"
iced_layershell = "0.19.1"
libc = "0.2.176"
niri-ipc = "26.4.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.53.0", features = [
  "rt-multi-thread",
  "macros",
  "time",
  "sync",
] }

# Local checkout of exwlshelleventloop so we can instrument/fix the multi-surface
# frame-callback stall in layershellev/iced_layershell.
[patch.crates-io]
iced_layershell = { path = "../exwlshelleventloop/iced_layershell" }
iced_layershell_macros = { path = "../exwlshelleventloop/iced_layershell_macros" }
layershellev = { path = "../exwlshelleventloop/layershellev" }
