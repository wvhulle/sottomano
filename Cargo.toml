[workspace]
resolver = "3"
members = ["vetrata-shell", "vetrata-readme-showcase"]
default-members = ["vetrata-shell"]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.lints.clippy]
absolute_paths = "warn"
pedantic = { priority = -1, level = "warn" }
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
needless_for_each = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
implicit_hasher = "allow"

[workspace.dependencies]
bytesize = "2.7.0"
chrono = { version = "0.4.45", default-features = false, features = [
  "clock",
  "serde",
  "std",
  "unstable-locales",
] }
clap = { version = "4.6.7", features = ["derive"] }
iced = { version = "0.14.0", default-features = false, features = [
  "wgpu",
  "tiny-skia",
  "crisp",
  "web-colors",
  "thread-pool",
  "linux-theme-detection",
  "x11",
  "wayland",
  "advanced",
  "tokio",
  "image-without-codecs",
  "svg",
  "canvas",
] }
niri-ipc = "26.4.0"
rust_decimal = { version = "1.43.0", features = ["serde-float"] }
rusty-money = "0.5.1"
situo-client = { git = "https://codeberg.org/wvhulle/situo", branch = "main" }
uom = { version = "0.38.0", default-features = false, features = [
  "autoconvert",
  "f64",
  "si",
  "std",
] }

[patch.crates-io]
iced = { git = "https://github.com/wvhulle/iced.git", branch = "skip-low-alpha-surface-formats" }
iced_core = { git = "https://github.com/wvhulle/iced.git", branch = "skip-low-alpha-surface-formats" }
iced_debug = { git = "https://github.com/wvhulle/iced.git", branch = "skip-low-alpha-surface-formats" }
iced_devtools = { git = "https://github.com/wvhulle/iced.git", branch = "skip-low-alpha-surface-formats" }
iced_futures = { git = "https://github.com/wvhulle/iced.git", branch = "skip-low-alpha-surface-formats" }
iced_graphics = { git = "https://github.com/wvhulle/iced.git", branch = "skip-low-alpha-surface-formats" }
iced_program = { git = "https://github.com/wvhulle/iced.git", branch = "skip-low-alpha-surface-formats" }
iced_renderer = { git = "https://github.com/wvhulle/iced.git", branch = "skip-low-alpha-surface-formats" }
iced_runtime = { git = "https://github.com/wvhulle/iced.git", branch = "skip-low-alpha-surface-formats" }
iced_selector = { git = "https://github.com/wvhulle/iced.git", branch = "skip-low-alpha-surface-formats" }
iced_test = { git = "https://github.com/wvhulle/iced.git", branch = "skip-low-alpha-surface-formats" }
iced_tiny_skia = { git = "https://github.com/wvhulle/iced.git", branch = "skip-low-alpha-surface-formats" }
iced_wgpu = { git = "https://github.com/wvhulle/iced.git", branch = "skip-low-alpha-surface-formats" }
iced_widget = { git = "https://github.com/wvhulle/iced.git", branch = "skip-low-alpha-surface-formats" }
iced_winit = { git = "https://github.com/wvhulle/iced.git", branch = "skip-low-alpha-surface-formats" }

[profile.dev.package."*"]
opt-level = 2
