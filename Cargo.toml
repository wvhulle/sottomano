[package]
name = "odin-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
iced = { version = "0.14.0", features = ["tokio"] }
iced_layershell = "0.19.1"
niri-ipc = "26.4.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.53.0", features = ["process", "rt-multi-thread", "macros", "time", "sync"] }
