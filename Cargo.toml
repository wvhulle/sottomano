[package]
edition = "2024"
name = "vetrata"
version = "0.1.0"

[lints.clippy]
absolute_paths = "warn"
pedantic = { priority = -1, level = "warn" }
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"

[dependencies]
chrono = { version = "0.4", default-features = false, features = [
  "clock",
  "std",
] }
color = { version = "0.3.3", features = ["serde"] }
freedesktop-desktop-entry = "0.8.1"
freedesktop-icons = "0.4.0"
freedesktop-sound = "0.1"
humantime = "2.3"
iced = { version = "0.14.0", features = ["tokio", "image", "svg", "canvas"] }
iced_font_awesome = "0.4.2"
iced_layershell = { git = "https://github.com/wvhulle/exwlshelleventloop.git", branch = "master" }
image = { version = "0.25", default-features = false, features = ["png"] }
libc = "0.2.176"
niri-ipc = "26.4.0"
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
simpleicons-rs = "16.27"
systemd = "0.10"
system-tray = "0.8"
ttf-parser = "0.25"
tokio = { version = "1.53.0", features = [
  "rt-multi-thread",
  "macros",
  "time",
  "sync",
] }
tokio-stream = { version = "0.1", default-features = false, features = [
  "sync",
  "time",
] }
toml = "0.8.23"
turso = "0.8.0-pre.1"
usvg = "0.45"
wayrs-client = { version = "1", features = ["tokio"] }
wayrs-protocols = { version = "0.14", features = ["ext-idle-notify-v1"] }
zbus = { version = "5.18", default-features = false, features = [
  "tokio",
  "blocking-api",
] }
adskalman = "0.17.0"
nalgebra = "0.34"
pipewire = "0.8"

[build-dependencies]
serde_json = "1"
