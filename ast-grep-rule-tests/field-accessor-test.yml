id: field-accessor
valid:
  - "impl Counter { fn doubled(&self) -> u32 { self.count * 2 } }"
  - "impl Counter { fn offset(&self, offset: u32) -> u32 { self.count } }"
  - "impl Counter { fn labelled(&self) -> String { format!(\"{}\", self.name) } }"
  - "impl<S: Source> Iterator for Feed<S> { type Item = u32; fn next(&self) -> u32 { self.count } }"
  - "impl Deref for Counter { type Target = u32; fn deref(&self) -> &u32 { &self.count } }"
  - "mod tests { impl Counter { fn count(&self) -> u32 { self.count } } }"
invalid:
  - "impl Counter { pub fn count(&self) -> u32 { self.count } }"
  - "impl Counter { #[must_use] pub(crate) fn name(&self) -> &str { &self.name } }"
  - "impl Counter { fn items(&self) -> Vec<u32> { self.items.clone() } }"
  - "impl Counter { fn count(&mut self) -> u32 { self.count } }"
  - "impl Counter { pub const fn count(&self) -> u32 { self.count } }"
  - "impl<'a> Holder<'a> { fn name<'b>(&'b self) -> &'b str { &self.name } }"
