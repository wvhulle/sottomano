id: hover-area-outside-row-views
valid:
  - "fn transport(config: &Config) -> Element<'_, Message> { row([previous_button(config), next_button(config)]).into() }"
invalid:
  - "fn next_button<'a>(content: Element<'a, Message>, target: HoverTarget) -> Element<'a, Message> { hoverable(NestedMenuOpenTrigger::Hover, content, target, Message::HoverCard) }"
  - "fn seek_bar<'a>(content: Element<'a, Message>, target: HoverTarget) -> Element<'a, Message> { hover_cards::hoverable(NestedMenuOpenTrigger::Hover, content, target, Message::HoverCard) }"
