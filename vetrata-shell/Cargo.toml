[package]
name = "vetrata-shell"
edition.workspace = true
version.workspace = true

[[bin]]
name = "vetrata"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
vetrata-config = { path = "../vetrata-config" }
vetrata-sources = { path = "../vetrata-sources" }
vetrata-state = { path = "../vetrata-state" }
vetrata-widgets = { path = "../vetrata-widgets" }
chrono.workspace = true
clap.workspace = true
iced.workspace = true
iced_exwlshell.workspace = true
iced_wayland_subscriber = { git = "https://github.com/wvhulle/exwlshelleventloop.git", branch = "master" }
wayland-client = "0.31.15"
tracing.workspace = true
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
niri-ipc.workspace = true
reqwest.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
zbus.workspace = true
uom.workspace = true

[features]
devtools = ["iced_exwlshell/debug"]
time-travel = ["iced_exwlshell/time-travel"]
