[package]
name = "vetrata-shell"
edition.workspace = true
version.workspace = true
build = "build/main.rs"

[[bin]]
name = "vetrata"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
vetrata-config = { path = "../vetrata-config" }
chrono.workspace = true
clap.workspace = true
form_urlencoded = "1.2.2"
freedesktop-desktop-entry = "0.8.3"
freedesktop-icons = "0.4.0"
freedesktop-sound = "0.1.0"
humantime = "2.4.0"
iced.workspace = true
icu_locale_core = "2.3.0"
sys-locale = "0.3.2"
iced_exwlshell = { git = "https://github.com/wvhulle/exwlshelleventloop.git", branch = "master" }
iced_wayland_subscriber = { git = "https://github.com/wvhulle/exwlshelleventloop.git", branch = "master" }
wayland-client = "0.31.15"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
image = { version = "0.25.10", default-features = false, features = [
  "png",
  "jpeg",
  "webp",
  "ico",
  "gif",
] }
libc = "0.2.190"
niri-ipc.workspace = true
procfs = { version = "0.18.0", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = [
  "rustls",
] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde.workspace = true
serde_json = "1.0.154"
sha2 = "0.11.1"
simpleicons-rs = "16.35.0"
situo-client.workspace = true
sunrise = "3.0.0"
systemd = "0.10.1"
system-tray = "0.8.9"
tokio = { version = "1.53.3", features = [
  "fs",
  "process",
  "rt-multi-thread",
  "macros",
  "time",
  "sync",
] }
tokio-stream = { version = "0.1.19", default-features = false, features = [
  "sync",
  "time",
] }
toml.workspace = true
quick-xml = "0.42"
turso = "0.8.3"
usvg = "0.48.1"
wayrs-client = { version = "1.3.1", features = ["tokio"] }
wayrs-protocols = { version = "0.14.11", features = ["ext-idle-notify-v1"] }
zbus = { version = "5.19.0", default-features = false, features = [
  "tokio",
  "blocking-api",
] }
adskalman = "0.18.0"
nalgebra = "0.35"
pipewire = "0.10.1"
bytesize.workspace = true
inotify = "0.11.5"
uom.workspace = true
kdl = { version = "6.7.1", default-features = false, features = ["v1"] }
club-kdl = { version = "0.14.1", features = ["kdl-rs"] }
chrono-tz.workspace = true
nvml-wrapper = "0.13.0"
perf-event2 = "0.7.4"
rusty-money.workspace = true
rust_decimal.workspace = true
pin-project-lite = "0.2.17"
