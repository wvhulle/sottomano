when:
  - repo: wvhulle/sottomano
    event: [push, manual]
    branch: main
    path:
      include: ["sottomano-toml-config/**", "xtask/**", "docs/configuration.md"]
    evaluate: 'not (CI_COMMIT_MESSAGE contains "update default config")'

labels:
  host: ryzen

depends_on:
  - checks

variables:
  - &config_docs_branch config-docs
  - &config_docs_title "docs: update default config"

steps:
  - name: update-config-docs
    image: nixos/nix:latest
    environment:
      NIX_CONFIG: |
        experimental-features = nix-command flakes
        extra-substituters = https://wvhulle.cachix.org
        extra-trusted-public-keys = wvhulle.cachix.org-1:heXx8DZMiRsKUx6l1TxNoF+Nmtmz66QEdsonQzc1ir0=
    commands:
      - nix develop --command cargo xtask update-config-docs

  - name: push-config-docs-branch
    image: appleboy/drone-git-push
    settings:
      remote: https://codeberg.org/${CI_REPO}.git
      netrc_machine: codeberg.org
      username: wvhulle
      password:
        from_secret: codeberg_token
      branch: *config_docs_branch
      force: true
      commit: true
      commit_message: *config_docs_title
      author_name: sottomano-ci
      author_email: willemvanhulle@protonmail.com

  - name: open-config-docs-pr
    image: woodpeckercommunity/gitea-pull-request-create-plugin:latest
    settings:
      gitea_address: https://codeberg.org
      gitea_token:
        from_secret: codeberg_token
      owner: ${CI_REPO_OWNER}
      repo: ${CI_REPO_NAME}
      branch: *config_docs_branch
      base_branch: main
      pr_title: *config_docs_title
      pr_body: Regenerated by `cargo xtask update-config-docs` in the config-docs pipeline.
      skip_on_empty_branch: true
      close_pr_if_empty: true
      delete_branch_if_empty: true
