when:
  - repo: wvhulle/sottomano
    event: pull_request
  - repo: wvhulle/sottomano
    event: [push, manual]
    branch: main

labels:
  host: ryzen

variables:
  - &nix_config
    NIX_CONFIG: |
      experimental-features = nix-command flakes
      max-jobs = 1
      cores = 2
      accept-flake-config = true
  - &after_dependency_step
    - status: [success, failure]

steps:
  - name: prepare-build-dependencies
    image: nixos/nix:latest
    depends_on: []
    environment: *nix_config
    commands:
      - nix develop --quiet .#ci --command ci/nix-built-paths.nu build-unless-cached .#packages.x86_64-linux.cargo-dependencies

  - name: run-test-suite
    image: nixos/nix:latest
    depends_on: [prepare-build-dependencies]
    when: *after_dependency_step
    environment: *nix_config
    commands:
      - nix develop --quiet .#ci --command ci/nix-built-paths.nu import-exported-paths
      - nix develop --quiet .#ci --command ci/nix-built-paths.nu build-and-export-paths .#checks.x86_64-linux.cargo-test

  - name: lint-with-clippy
    image: nixos/nix:latest
    depends_on: [prepare-build-dependencies]
    when: *after_dependency_step
    environment: *nix_config
    commands:
      - nix develop --quiet .#ci --command ci/nix-built-paths.nu import-exported-paths
      - nix develop --quiet .#ci --command ci/nix-built-paths.nu build-and-export-paths .#checks.x86_64-linux.cargo-clippy

  - name: upload-builds-to-cachix
    image: nixos/nix:latest
    depends_on: [run-test-suite, lint-with-clippy]
    when:
      - event: [push, manual]
        status: [success, failure]
    environment:
      <<: *nix_config
      CACHIX_AUTH_TOKEN:
        from_secret: cachix_auth_token
    commands:
      - nix develop --quiet .#ci --command ci/nix-built-paths.nu upload-exported-paths

  - name: run-pre-commit-hooks
    image: nixos/nix:latest
    depends_on: []
    environment: *nix_config
    commands:
      - nix build --quiet --no-link --print-build-logs .#checks.x86_64-linux.pre-commit

  - name: check-commit-messages
    image: nixos/nix:latest
    depends_on: []
    when:
      - event: pull_request
    environment: *nix_config
    commands:
      - nix develop --quiet .#ci --command ci/release-tasks.nu check-commit-messages --fetch-target-branch FETCH_HEAD..HEAD
