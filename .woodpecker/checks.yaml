when:
  - repo: wvhulle/sottomano
    event: pull_request
  - repo: wvhulle/sottomano
    event: [push, manual]
    branch: main

labels:
  host: ryzen

variables:
  - &nix_config
    NIX_CONFIG: |
      experimental-features = nix-command flakes
      max-jobs = 1
      cores = 2
      extra-substituters = https://wvhulle.cachix.org
      extra-trusted-public-keys = wvhulle.cachix.org-1:heXx8DZMiRsKUx6l1TxNoF+Nmtmz66QEdsonQzc1ir0=
  - &cache_writing_env
    <<: *nix_config
    CACHIX_AUTH_TOKEN:
      from_secret: cachix_auth_token
  - &on_trusted_events
    - event: [push, manual]
  - &on_pull_requests
    - event: pull_request

steps:
  - name: cargo-checks
    image: nixos/nix:latest
    depends_on: []
    when: *on_trusted_events
    environment: *cache_writing_env
    commands:
      - nix build --quiet --no-link .#checks.x86_64-linux.tests .#checks.x86_64-linux.clippy
      - nix-store --query --requisites --include-outputs $(nix path-info --derivation .#checks.x86_64-linux.tests .#checks.x86_64-linux.clippy) | grep -v '\.drv' | nix run --inputs-from . nixpkgs#cachix -- push wvhulle > /dev/null

  - name: cargo-checks-pr
    image: nixos/nix:latest
    depends_on: []
    when: *on_pull_requests
    environment: *nix_config
    commands:
      - nix build --quiet --no-link .#checks.x86_64-linux.tests .#checks.x86_64-linux.clippy

  - name: format
    image: nixos/nix:latest
    depends_on: []
    environment: *nix_config
    commands:
      - nix build --quiet --no-link .#checks.x86_64-linux.format

  - name: conventional-commits
    image: nixos/nix:latest
    depends_on: []
    when: *on_pull_requests
    environment: *nix_config
    commands:
      - git fetch --quiet origin "$${CI_COMMIT_TARGET_BRANCH}"
      - nix run --inputs-from . nixpkgs#convco -- check FETCH_HEAD..HEAD
