when:
  - repo: wvhulle/sottomano
    event: pull_request
  - repo: wvhulle/sottomano
    event: [push, manual]
    branch: main

labels:
  host: ryzen

variables:
  - &nix_config
    NIX_CONFIG: |
      experimental-features = nix-command flakes
      max-jobs = 1
      cores = 2
      extra-substituters = https://wvhulle.cachix.org
      extra-trusted-public-keys = wvhulle.cachix.org-1:heXx8DZMiRsKUx6l1TxNoF+Nmtmz66QEdsonQzc1ir0=
  - &after_dependency_step
    - status: [success, failure]

steps:
  - name: prepare-build-dependencies
    image: nixos/nix:latest
    depends_on: []
    environment: *nix_config
    commands:
      - nix run --quiet .#build-unless-cached -- .#packages.x86_64-linux.workspace-dependencies

  - name: run-test-suite
    image: nixos/nix:latest
    depends_on: [prepare-build-dependencies]
    when: *after_dependency_step
    environment: *nix_config
    commands:
      - nix run --quiet .#import-exported-paths
      - nix run --quiet .#build-and-export-paths -- .#checks.x86_64-linux.tests

  - name: lint-with-clippy
    image: nixos/nix:latest
    depends_on: [prepare-build-dependencies]
    when: *after_dependency_step
    environment: *nix_config
    commands:
      - nix run --quiet .#import-exported-paths
      - nix run --quiet .#build-and-export-paths -- .#checks.x86_64-linux.clippy

  - name: upload-builds-to-cachix
    image: nixos/nix:latest
    depends_on: [run-test-suite, lint-with-clippy]
    when:
      - event: [push, manual]
        status: [success, failure]
    environment:
      <<: *nix_config
      CACHIX_AUTH_TOKEN:
        from_secret: cachix_auth_token
    commands:
      - nix run --quiet .#upload-exported-paths

  - name: run-pre-commit-hooks
    image: nixos/nix:latest
    depends_on: []
    environment: *nix_config
    commands:
      - nix run --quiet .#run-pre-commit-hooks

  - name: check-commit-messages
    image: nixos/nix:latest
    depends_on: []
    when:
      - event: pull_request
    environment: *nix_config
    commands:
      - nix run --quiet .#check-commit-messages -- --fetch-target-branch FETCH_HEAD..HEAD
