when:
  - repo: wvhulle/sottomano
    event: pull_request
  - repo: wvhulle/sottomano
    event: [push, manual]
    branch: main

labels:
  host: ryzen

variables:
  - &nix_config
    NIX_CONFIG: |
      experimental-features = nix-command flakes
      max-jobs = 1
      cores = 2
      extra-substituters = https://wvhulle.cachix.org
      extra-trusted-public-keys = wvhulle.cachix.org-1:heXx8DZMiRsKUx6l1TxNoF+Nmtmz66QEdsonQzc1ir0=
  - &on_pull_requests
    - event: pull_request
  - &after_dependencies
    - status: [success, failure]

steps:
  - name: build-workspace-dependencies
    image: nixos/nix:latest
    depends_on: []
    environment: *nix_config
    commands:
      - nix run --quiet .#build-unless-cached -- .#packages.x86_64-linux.workspace-dependencies

  - name: cargo-test
    image: nixos/nix:latest
    depends_on: [build-workspace-dependencies]
    when: *after_dependencies
    environment: *nix_config
    commands:
      - nix run --quiet .#import-exported-paths
      - nix run --quiet .#build-and-export-paths -- .#checks.x86_64-linux.tests

  - name: cargo-clippy
    image: nixos/nix:latest
    depends_on: [build-workspace-dependencies]
    when: *after_dependencies
    environment: *nix_config
    commands:
      - nix run --quiet .#import-exported-paths
      - nix run --quiet .#build-and-export-paths -- .#checks.x86_64-linux.clippy

  - name: format
    image: nixos/nix:latest
    depends_on: [build-workspace-dependencies]
    when: *after_dependencies
    environment: *nix_config
    commands:
      - nix run --quiet .#import-exported-paths
      - nix build --quiet --print-build-logs --no-link .#checks.x86_64-linux.format

  - name: ci-task-tests
    image: nixos/nix:latest
    depends_on: []
    environment: *nix_config
    commands:
      - nix build --quiet --print-build-logs --no-link .#checks.x86_64-linux.ci-task-tests

  - name: upload-exported-paths
    image: nixos/nix:latest
    depends_on: [cargo-test, cargo-clippy]
    when:
      - event: [push, manual]
        status: [success, failure]
    environment:
      <<: *nix_config
      CACHIX_AUTH_TOKEN:
        from_secret: cachix_auth_token
    commands:
      - nix run --quiet .#upload-exported-paths

  - name: conventional-commits
    image: nixos/nix:latest
    depends_on: []
    when: *on_pull_requests
    environment: *nix_config
    commands:
      - nix run --quiet .#check-commits -- --fetch-target-branch FETCH_HEAD..HEAD
