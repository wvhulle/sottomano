when:
  - repo: wvhulle/sottomano
    event: cron
    cron: weekly-dependency-update

labels:
  host: ryzen

clone:
  - name: clone-with-history
    image: woodpeckerci/plugin-git
    settings:
      depth: 0
      partial: false

steps:
  - name: open-dependency-update-pr
    image: nixos/nix:latest
    environment:
      NIX_CONFIG: |
        experimental-features = nix-command flakes
        extra-substituters = https://wvhulle.cachix.org
        extra-trusted-public-keys = wvhulle.cachix.org-1:heXx8DZMiRsKUx6l1TxNoF+Nmtmz66QEdsonQzc1ir0=
      GIT_AUTHOR_NAME: wvhulle-bot
      GIT_AUTHOR_EMAIL: willemvanhulle@protonmail.com
      GIT_COMMITTER_NAME: wvhulle-bot
      GIT_COMMITTER_EMAIL: willemvanhulle@protonmail.com
      CODEBERG_TOKEN:
        from_secret: bot_token
    commands:
      - nix run --quiet .#open-dependency-update-pr -- --cargo-lock --flake-lock
