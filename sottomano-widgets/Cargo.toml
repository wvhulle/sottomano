[package]
name = "sottomano-widgets"
edition.workspace = true
version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
corredo = { path = "../corredo", features = ["chrono", "karaoke", "markup"] }
strum.workspace = true
futures-rx.workspace = true
sottomano-toml-config = { path = "../sottomano-toml-config" }
sottomano-phosphor-icons = { path = "../sottomano-phosphor-icons" }
sottomano-simple-icons = { path = "../sottomano-simple-icons" }
sottomano-weather-icons = { path = "../sottomano-weather-icons" }
sottomano-compositor-model = { path = "../sottomano-compositor-model" }
sottomano-compositors = { path = "../sottomano-compositors" }
sottomano-desktop-sources = { path = "../sottomano-desktop-sources" }
sottomano-desktop-sinks = { path = "../sottomano-desktop-sinks" }
bytesize.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
fixed_decimal = { version = "0.7.3", features = ["ryu"] }
icu_decimal = { version = "2.4.0", features = ["alloc"] }
icu_experimental = "0.7.0"
icu_provider = { version = "2.4.0", features = ["logging"] }
icu_locale_core.workspace = true
jiff.workspace = true
iced.workspace = true
iced_controller_diagram.workspace = true
iced_exwlshell.workspace = true
image.workspace = true
notulist-client.workspace = true
reqwest.workspace = true
rust_decimal.workspace = true
rusty-money.workspace = true
situo-client.workspace = true
tokio.workspace = true
tracing.workspace = true
turso.workspace = true
uom.workspace = true
usvg.workspace = true
zbus.workspace = true

[dev-dependencies]
sottomano-desktop-sources = { path = "../sottomano-desktop-sources", features = ["test-support"] }
sottomano-compositors = { path = "../sottomano-compositors", features = ["niri"] }
iced_test.workspace = true
sottomano-widget-scenes = { path = "../sottomano-widget-scenes" }
sha2 = "0.10.9"

[package.metadata.cargo-machete]
ignored = ["icu_provider"]
