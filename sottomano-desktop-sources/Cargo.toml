[package]
name = "sottomano-desktop-sources"
edition.workspace = true
version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
sottomano-db-migrations = { path = "../db-migrations" }
sottomano-toml-config = { path = "../sottomano-toml-config" }
sottomano-compositor-model = { path = "../sottomano-compositor-model" }
sottomano-compositors = { path = "../sottomano-compositors" }
adskalman = "0.18.0"
base64 = "0.22.1"
bytesize.workspace = true
calcard = "0.3.14"
chrono.workspace = true
chrono-tz.workspace = true
color.workspace = true
evdev = { version = "0.13.2", features = ["stream-trait"] }
freedesktop-desktop-entry = "0.8.3"
futures.workspace = true
futures-rx.workspace = true
http = "1.4.0"
hyper-tls = "0.6.0"
hyper-util = { version = "0.1.20", features = ["client-legacy", "http1", "tokio"] }
jiff.workspace = true
libdav = "0.11.2"
icu_locale_core.workspace = true
image.workspace = true
inotify = "0.11.5"
ipnet = { version = "2.12.2", features = ["serde"] }

nalgebra = "0.35"
nvml-wrapper = "0.13.0"
perf-event2 = "0.7.4"
pin-project-lite = "0.2.17"
pipewire = "0.10.1"
procfs = { version = "0.18.0", default-features = false }
qmlib = { version = "2.3.0", default-features = false }
rustix = { workspace = true, features = ["fs", "net", "process", "time"] }
notulist-client.workspace = true
reqwest = { workspace = true, features = ["stream"] }
roxmltree = "0.21.2"
rust_decimal.workspace = true
rusty-money.workspace = true
serde.workspace = true
serde_json.workspace = true
x11rb = "0.13.2"
situo-client.workspace = true
sunrise = "3.0.0"
system-tray.workspace = true
systemd = "0.10.1"
thiserror.workspace = true
tokio = { workspace = true, features = ["net"] }
tokio-stream = { version = "0.1.19", default-features = false, features = [
  "sync",
  "time",
] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = [
  "connect",
  "native-tls",
] }
toml.workspace = true
tower-http = { version = "0.6.8", features = ["auth"] }
tracing.workspace = true
url = "2.5.8"
turso.workspace = true
uom.workspace = true
usvg.workspace = true
virt = { workspace = true, optional = true }
winnow = "1.0.4"
wayrs-client = { version = "1.3.1", features = ["tokio"] }
wayrs-protocols = { version = "0.14.11", features = [
  "ext-idle-notify-v1",
  "wlr-virtual-pointer-unstable-v1",
] }
zbus.workspace = true
zbus_xml = "5.2.1"

[features]
libvirt-domains = ["dep:virt"]
test-support = ["sottomano-compositor-model/test-support"]

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[package.metadata.cargo-machete]
ignored = ["perf-event2"]
