[package]
name = "sottomano-desktop-sources"
edition.workspace = true
version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
sottomano-db-migrations = { path = "../db-migrations" }
sottomano-toml-config = { path = "../sottomano-toml-config" }
adskalman = "0.18.0"
base64 = "0.22.1"
bytesize.workspace = true
calcard = "0.3.14"
chrono.workspace = true
chrono-tz.workspace = true
color = "0.3.3"
evdev = { version = "0.13.2", features = ["stream-trait"] }
fast-dav-rs = "0.19.0"
form_urlencoded.workspace = true
freedesktop-desktop-entry = "0.8.3"
freedesktop-icons = "0.4.0"
futures.workspace = true
futures-rx.workspace = true
fastrand = "2.5.0"
humantime.workspace = true
iana-time-zone = "0.1.65"
icalendar = { version = "0.17.15", features = ["parser", "chrono-tz"] }
icu_locale_core.workspace = true
image.workspace = true
inotify = "0.11.5"
ipnet = { version = "2.12.2", features = ["serde"] }
kdl.workspace = true
libc = "0.2.190"
nalgebra.workspace = true
niri-ipc = { workspace = true, optional = true }
nvml-wrapper = "0.13.0"
perf-event2 = "0.7.4"
pin-project-lite = "0.2.17"
pipewire = "0.10.1"
procfs = { version = "0.18.0", default-features = false }
qmlib = { version = "2.3.0", default-features = false }
rustix = { version = "1.1.5", features = ["fs", "process", "time"] }
notulist-client.workspace = true
reqwest = { workspace = true, features = ["stream"] }
roxmltree = "0.21.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rust_decimal.workspace = true
rusty-money.workspace = true
serde.workspace = true
serde_json = "1.0.154"
x11rb = "0.13.2"
swayipc-types = { version = "2.0.3", optional = true }
socket2 = "0.6.5"
situo-client.workspace = true
sunrise = "3.0.0"
sys-locale = "0.3.2"
system-tray.workspace = true
systemd = "0.10.1"
thiserror.workspace = true
tokio = { workspace = true, features = ["net"] }
tokio-stream.workspace = true
tokio-util.workspace = true
tokio-tungstenite = { version = "0.30.0", default-features = false, features = [
  "connect",
  "rustls-tls-native-roots",
] }
toml.workspace = true
tracing.workspace = true
turso.workspace = true
uom.workspace = true
usvg.workspace = true
virt = { version = "0.4.3", optional = true }
wayrs-client = { version = "1.3.1", features = ["tokio"] }
wayrs-protocols = { version = "0.14.11", features = [
  "ext-idle-notify-v1",
  "wlr-virtual-pointer-unstable-v1",
] }
zbus.workspace = true
zbus_xml.workspace = true

[features]
hyprland = []
libvirt-domains = ["dep:virt"]
niri = ["dep:niri-ipc"]
sway = ["dep:swayipc-types"]
test-support = []

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
