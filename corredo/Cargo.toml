[package]
name = "corredo"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "High-level, ready-to-use widgets for the iced GUI library"
repository = "https://github.com/wvhulle/sottomano"
keywords = ["iced", "widget", "gui", "animation"]
categories = ["gui"]
readme = "README.md"
publish = false

[lints]
workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std", "unstable-locales"], optional = true }
iced = { version = "0.14.0", default-features = false, features = ["advanced", "canvas", "svg", "thread-pool", "tiny-skia", "wayland", "wgpu", "x11"] }
iced_wgpu = "0.14.0"
quick-xml = { version = "0.42", optional = true }
unicode-segmentation = { version = "1", optional = true }

[dev-dependencies]
iced = { version = "0.14.0", features = ["advanced", "svg", "canvas"] }
iced_test = "0.14.0"

[features]
chrono = ["dep:chrono"]
karaoke = ["dep:unicode-segmentation"]
markup = ["dep:quick-xml"]

[[test]]
name = "default_widgets"
required-features = ["chrono"]

[[example]]
name = "widget_gallery"
required-features = ["chrono"]
