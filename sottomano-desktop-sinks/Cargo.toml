[package]
name = "sottomano-desktop-sinks"
edition.workspace = true
version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
sottomano-desktop-sources = { path = "../sottomano-desktop-sources" }
sottomano-compositor-model = { path = "../sottomano-compositor-model" }
sottomano-compositors = { path = "../sottomano-compositors" }
sottomano-toml-config = { path = "../sottomano-toml-config" }
freedesktop-sound = "0.1.0"
futures.workspace = true
notulist-client.workspace = true
rustix = { workspace = true, features = ["process"] }
serde_json.workspace = true
system-tray.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
virt = { workspace = true, optional = true }
zbus.workspace = true

[features]
libvirt-domains = ["dep:virt", "sottomano-desktop-sources/libvirt-domains"]

[dev-dependencies]
sottomano-compositors = { path = "../sottomano-compositors", features = ["niri"] }
