[package]
name = "sottomano-desktop-sinks"
edition.workspace = true
version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
sottomano-desktop-sources = { path = "../sottomano-desktop-sources" }
sottomano-toml-config = { path = "../sottomano-toml-config" }
freedesktop-sound = "0.1.0"
futures.workspace = true
niri-ipc = { workspace = true, optional = true }
notulist-client.workspace = true
serde.workspace = true
serde_json = "1.0.154"
system-tray.workspace = true
tokio.workspace = true
tracing.workspace = true
virt = { version = "0.4.3", optional = true }
zbus.workspace = true

[features]
hyprland = ["sottomano-desktop-sources/hyprland"]
libvirt-domains = ["dep:virt", "sottomano-desktop-sources/libvirt-domains"]
niri = ["dep:niri-ipc", "sottomano-desktop-sources/niri"]
sway = ["sottomano-desktop-sources/sway"]
