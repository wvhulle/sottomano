[package]
name = "sottomano-desktop-sinks"
edition.workspace = true
version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
sottomano-desktop-sources = { path = "../sottomano-desktop-sources" }
sottomano-toml-config = { path = "../sottomano-toml-config" }
club-kdl = { version = "0.14.1", features = ["kdl-rs"], optional = true }
freedesktop-sound = "0.1.0"
kdl = { workspace = true, optional = true }
futures.workspace = true
niri-ipc = { workspace = true, optional = true }
notulist-client.workspace = true
serde.workspace = true
serde_json = "1.0.154"
swayipc-types = { version = "2.0.3", optional = true }
system-tray.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
virt = { version = "0.4.3", optional = true }
zbus.workspace = true

[features]
hyprland = ["sottomano-desktop-sources/hyprland"]
libvirt-domains = ["dep:virt", "sottomano-desktop-sources/libvirt-domains"]
niri = ["dep:club-kdl", "dep:kdl", "dep:niri-ipc", "sottomano-desktop-sources/niri"]
sway = ["dep:swayipc-types", "sottomano-desktop-sources/sway"]
